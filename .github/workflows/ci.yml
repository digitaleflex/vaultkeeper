name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...

  release:
    # se déclenche sur un tag v* poussé, ou sur une release publiée depuis GitHub
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [web, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Interface web
        run: cd web && npm ci && npm run build
      - name: Paquets (zip, tar.gz, deb)
        run: scripts/package.sh "${{ github.ref_name }}"
      - name: Publication
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "VaultKeeper $TAG" --generate-notes
          gh release upload "$TAG" dist/* --clobber
